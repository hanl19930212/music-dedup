[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-dedup"
version = "0.1.0"
description = "Windows 音乐重复文件检测与元数据刮削工具"
requires-python = ">=3.11"
authors = [{ name = "music-dedup" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "mutagen>=1.47",
    "send2trash>=1.8",
    "jinja2>=3.1",
    "requests>=2.31",
    "tomli-w>=1.0",
]

[project.scripts]
music-dedup = "music_dedup.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
